<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lab Inseguro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <div class="card-body">
                        <h2 class="text-center mb-4">Iniciar Sesión</h2>
                        <form action="/auth/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" placeholder="admin" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" placeholder="•••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
                        </form>
                        <div class="text-center mt-3">
                            <p class="small text-muted">¿No tienes cuenta? <a href="register.html" class="text-decoration-none">Regístrate</a></p>
                        </div>
                        <div class="alert alert-danger py-1 mt-3 text-center" style="font-size: 0.7rem;">
                            ⚠️ ENTORNO VULNERABLE A INYECCIÓN SQL
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
