<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Usuarios - Práctica SQL Injection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Panel de Búsqueda 
            </span>
            <a href="/dashboard.html" class="btn btn-outline-light btn-sm">
                Volver al Dashboard
            </a>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-5">

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Card principal -->
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            🔎 Buscar Usuarios
                            <span class="badge bg-danger ms-2">Vulnerable</span>
                        </h5>
                    </div>

                    <div class="card-body">

                        <div class="input-group mb-3">
                            <span class="input-group-text bg-primary text-white">
                                Username
                            </span>
                            <input 
                                type="text" 
                                id="searchInput" 
                                class="form-control" 
                                placeholder="Escribe el username..."
                            >
                            <button 
                                id="btnBuscar" 
                                class="btn btn-danger"
                            >
                                Buscar
                            </button>
                        </div>

                        
                    </div>
                </div>

                <!-- Resultados -->
                <div class="card mt-4 shadow border-0">
                    <div class="card-header bg-secondary text-white">
                        <h6 class="mb-0">Resultados del Servidor</h6>
                    </div>
                    <div class="card-body bg-dark text-info">
                        <pre 
                            id="searchResult" 
                            class="mb-0"
                            style="min-height: 150px;"
                        ></pre>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS (opcional pero recomendado) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de búsqueda -->
    <script>
        document.getElementById('btnBuscar').addEventListener('click', async () => {
            const search = document.getElementById('searchInput').value;
            const resultBox = document.getElementById('searchResult');

            resultBox.textContent = "Cargando...";

            try {
                const response = await fetch(`/auth/buscar?search=${encodeURIComponent(search)}`);
                const data = await response.json();
                resultBox.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                resultBox.textContent = "Error: " + err.message;
            }
        });
    </script>

</body>
</html>
