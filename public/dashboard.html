<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Panel de Control (Inseguro)</span>
            <a href="/auth/logout" class="btn btn-outline-danger">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Usuarios en la Base de Datos</h4>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Password (Texto Plano)</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="text-end mt-3">
    <a href="/query.html" class="btn btn-danger">
        Barra de busqueda 
    </a>
</div>
    <script>
        // Al cargar la página, pedimos los datos al servidor
        fetch('/auth/users-list')
            .then(res => res.json())
            .then(data => {
                const tabla = document.getElementById('tabla-usuarios');
                data.forEach(user => {
                    tabla.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td><code>${user.password}</code></td>
                        </tr>
                    `;
                });
            });
    </script>
</body>
</html>
